<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ポートフォリオ用のデモのため検索に載せない。本番では noindex を外し、og:url・canonical（絶対 URL）を入れる -->
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#173f5f" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ほしの木税理士事務所（デモサイト）" />
<link rel="icon" href="{{root}}favicon.svg" />
<script>
  // JS が動く環境の目印。アニメーションで要素を隠すときは .js 配下に限定する（描画前に付けてちらつきを防ぐ）
  // main.js が読み込めなかったときに本文が隠れたままにならないよう、3秒で外す
  document.documentElement.classList.add('js')
  setTimeout(function () {
    if (!window.siteReady) document.documentElement.classList.remove('js')
  }, 3000)
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- 見出しと数字だけ Web フォント（描画を止めないよう後から読み込む）。本文は OS のゴシック -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Outfit:wght@600;700&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Outfit:wght@600;700&display=swap" /></noscript>
<link rel="stylesheet" href="{{root}}assets/scss/after.scss" />
<script src="{{root}}assets/js/after.js" defer onerror="document.documentElement.classList.remove('js')"></script>
