<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>コーディング サンプル集</title>
    <style>
      :root { color-scheme: light dark; --text: #222; --sub: #666; --bg: #fff; --line: #ddd; --link: #0b57d0; }
      @media (prefers-color-scheme: dark) { :root { --text: #eee; --sub: #aaa; --bg: #161616; --line: #333; --link: #8ab4f8; } }
      body { margin: 0; padding: 48px 16px; font-family: system-ui, sans-serif; line-height: 1.7; color: var(--text); background: var(--bg); }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: var(--sub); margin: 0 0 32px; }
      ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
      li { padding: 16px 0; border-bottom: 1px solid var(--line); }
      a { color: var(--link); font-weight: 700; }
      small { display: block; color: var(--sub); }
    </style>
  </head>
  <body>
    <main>
      <h1>コーディング サンプル集</h1>
      <p>デザインカンプ（Figma）からのコーディングのサンプルです。いずれも練習用カンプを使った架空のサイトです。</p>
      <ul>
        <li>
          <a href="./sample-01/">01. 英会話スクール LP</a>
          <small>HTML / SCSS / JavaScript・レスポンシブ・CSS アニメーション・ハンバーガーメニュー<br />デザイン：Codejump 練習用デザインカンプ「⑰ 応用編：ランディングページ／CSSアニメーション」</small>
        </li>
      </ul>
    </main>
  </body>
</html>
