<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f3eee6" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ひととき珈琲（デモサイト）" />
<!-- 共有時の画像。og:image は絶対 URL が必要なので、公開先が決まったらドメインを書き換える -->
<meta property="og:image" content="https://chameleon05119.github.io/portfolio/sample-04/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="{{root}}favicon.svg" />
<script>
  // JS が動く環境の目印。アニメーションで要素を隠すときは .js 配下に限定する（描画前に付けてちらつきを防ぐ）
  // main.js が読み込めなかったとき（アップロード漏れ・ブロックなど）に本文が隠れたままにならないよう、3秒で外す
  document.documentElement.classList.add('js')
  setTimeout(function () {
    if (!window.siteReady) document.documentElement.classList.remove('js')
  }, 3000)
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- フォントは描画を止めないように後から読み込む（読み込むまでは OS のフォントで表示）。
     本文は OS のゴシック（ヒラギノ・游ゴシックなど）を使い、Web フォントは見出しの明朝と英字だけにして読み込みを減らす -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Shippori+Mincho+B1:wght@500;700&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Shippori+Mincho+B1:wght@500;700&display=swap" /></noscript>
<link rel="stylesheet" href="{{root}}assets/scss/style.scss" />
<script src="{{root}}assets/js/main.js" defer onerror="document.documentElement.classList.remove('js')"></script>
