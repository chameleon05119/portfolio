[project]
name = "survey-report"
version = "0.1.0"
description = "形式のちがうアンケート回答（CSV・Excel）をまとめて、グラフ付きの Excel レポートにする"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
survey-report = "survey_report.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["survey_report"]
